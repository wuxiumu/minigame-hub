<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird · 像素小鸟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b1020;
    --panel: #131a2e;
    --board: #101830;
    --line: rgba(148, 163, 184, 0.08);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --snake: #34d399;
    --snake-head: #6ee7b7;
    --food: #fb7185;
    --accent: #38bdf8;
  }

  html, body { height: 100%; }

  body {
    background: radial-gradient(1200px 800px at 50% -10%, #16213c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(92vw, 440px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 .dot {
    width: 12px; height: 12px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--snake), var(--accent));
    box-shadow: 0 0 12px rgba(52, 211, 153, .6);
  }

  .scores { display: flex; gap: 10px; }

  .score-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 16px;
    min-width: 92px;
    text-align: center;
  }

  .score-card .label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .score-card .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  #score .value { color: var(--snake); }
  #best .value { color: var(--accent); }

  .board-shell {
    position: relative;
    background: var(--board);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .02);
    cursor: pointer;
  }

  canvas#game {
    display: block;
    width: 100%;
    max-width: 400px;
    height: auto;
    margin: 0 auto;
    border-radius: 14px;
    background: #0c1224;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 14px;
    background: rgba(8, 12, 26, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 3;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .overlay .final {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
  }

  .overlay .final b {
    color: var(--snake);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  .overlay .newbest {
    font-size: 13px;
    color: #fbbf24;
    display: none;
  }

  .overlay .newbest.show { display: block; }

  button {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #34d399, #38bdf8);
    color: #06251c;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 11px 30px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(56, 189, 248, .35);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56, 189, 248, .45); }
  button:active { transform: translateY(0); }

  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="dot"></span>Flappy Bird</h1>
      <div class="scores">
        <div class="score-card" id="score">
          <div class="label">得分</div>
          <div class="value">0</div>
        </div>
        <div class="score-card" id="best">
          <div class="label">最高分</div>
          <div class="value">0</div>
        </div>
      </div>
    </header>

    <div class="board-shell" id="shell">
      <canvas id="game" width="400" height="560"></canvas>
      <div class="overlay" id="overlay">
        <div class="title" id="overlayTitle">准备好了吗？</div>
        <div class="final" id="overlayText">点击画面或按 <b>空格</b> 起飞</div>
        <div class="newbest" id="newBest">🎉 新纪录！</div>
        <button id="restartBtn">开始游戏</button>
      </div>
    </div>

    <p class="hint">
      点击画面 / <kbd>空格</kbd> / <kbd>↑</kbd> 拍翅上升 &nbsp;·&nbsp;
      穿过管道 +1 分 &nbsp;·&nbsp; 撞到管道或落地结束 &nbsp;·&nbsp; <kbd>Enter</kbd> 重新开始
    </p>
  </div>

<script>
(function () {
  "use strict";

  // ---------- 常量 ----------
  var W = 400, H = 560, GROUND = 72;
  var BEST_KEY = "flappy.best.score";
  var GRAV = 1500;          // 重力加速度 px/s²
  var FLAP_V = -400;        // 拍翅初速度
  var PIPE_W = 64;
  var GAP0 = 160;           // 初始管缝
  var SPACING = 238;        // 管间距
  var FONT = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif';

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var shell = document.getElementById("shell");
  var scoreValue = document.querySelector("#score .value");
  var bestValue = document.querySelector("#best .value");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");
  var newBest = document.getElementById("newBest");
  var restartBtn = document.getElementById("restartBtn");

  // ---------- 游戏状态 ----------
  var bird, pipes, state, score, best;
  var scrollX = 0, tGlob = 0, spawnDist = 0, lastT = 0;

  best = loadBest();
  bestValue.textContent = best;

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(BEST_KEY), 10);
      return isNaN(v) || v < 0 ? 0 : v;
    } catch (e) { return 0; }
  }

  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  // 背景星星
  var stars = [];
  (function () {
    for (var i = 0; i < 36; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - GROUND - 80),
        r: 0.8 + Math.random() * 1.2,
        p: Math.random() * Math.PI * 2
      });
    }
  })();

  // ---------- 音效（WebAudio，零依赖） ----------
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(actx.destination);
      var n = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, n);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
      o.start(n);
      o.stop(n + dur);
    } catch (e) {}
  }

  // ---------- 逻辑 ----------
  function reset() {
    bird = { x: 96, y: H * 0.42, vy: 0, rot: 0, wing: 0, r: 14 };
    pipes = [];
    score = 0;
    scoreValue.textContent = "0";
    state = "ready";
    scrollX = 0;
    spawnDist = 120;
    restartBtn.textContent = "开始游戏";
    showOverlay("准备好了吗？", "点击画面或按 <b>空格</b> 起飞<br>穿过管道缝隙 +1 分");
  }

  function startPlay() {
    state = "play";
    restartBtn.textContent = "重新开始";
    hideOverlay();
    flap();
  }

  function flap() {
    bird.vy = FLAP_V;
    bird.wing = 0;
    beep(620, 0.05, "triangle", 0.03);
  }

  function action() {
    if (state === "ready") startPlay();
    else if (state === "play") flap();
  }

  function addPipe() {
    var gap = Math.max(118, GAP0 - score * 1.4);   // 分数越高缝隙越小
    var minY = 70;
    var maxY = H - GROUND - 70 - gap;
    var gapY = minY + Math.random() * Math.max(0, maxY - minY);
    pipes.push({ x: W + 30, gapY: gapY, gap: gap, passed: false });
  }

  function hitRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    beep(170, 0.28, "square", 0.06);
    if (score > best) {
      best = score;
      bestValue.textContent = best;
      saveBest(best);
    }
    setTimeout(function () {
      if (state !== "dead") return;
      newBest.className = "newbest" + (score > 0 && score === best ? " show" : "");
      restartBtn.textContent = "再来一局";
      showOverlay("游戏结束", "最终得分 <b>" + score + "</b>");
    }, 550);
  }

  function update(dt) {
    tGlob += dt;

    if (state === "ready") {
      bird.y = H * 0.42 + Math.sin(tGlob * 2.6) * 8;
      bird.wing = (bird.wing + dt * 5) % 1;
      scrollX += 60 * dt;
      return;
    }

    // 重力
    bird.vy += GRAV * dt;
    if (bird.vy > 720) bird.vy = 720;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy / 420));
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

    if (state === "play") {
      var spd = Math.min(235, 150 + score * 2.2);
      scrollX += spd * dt;
      spawnDist -= spd * dt;
      if (spawnDist <= 0) { addPipe(); spawnDist += SPACING; }

      for (var i = pipes.length - 1; i >= 0; i--) {
        var p = pipes[i];
        p.x -= spd * dt;
        if (!p.passed && p.x + PIPE_W < bird.x - bird.r) {
          p.passed = true;
          score++;
          scoreValue.textContent = score;
          beep(880, 0.07, "sine", 0.05);
        }
        if (p.x + PIPE_W < -20) pipes.splice(i, 1);
      }

      if (bird.y + bird.r >= H - GROUND) {
        bird.y = H - GROUND - bird.r;
        die();
        return;
      }
      for (i = 0; i < pipes.length; i++) {
        p = pipes[i];
        if (hitRect(bird.x, bird.y, bird.r, p.x, 0, PIPE_W, p.gapY) ||
            hitRect(bird.x, bird.y, bird.r, p.x, p.gapY + p.gap, PIPE_W, H - GROUND - (p.gapY + p.gap))) {
          die();
          return;
        }
      }
    } else {
      // dead：自由落体到地面
      if (bird.y + bird.r >= H - GROUND) {
        bird.y = H - GROUND - bird.r;
        bird.vy = 0;
        bird.rot = 1.35;
      }
    }

    bird.wing = (bird.wing + dt * (state === "play" ? 9 : 2)) % 1;
  }

  // ---------- 绘制 ----------
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawPipe(x, y, h, capAtTop) {
    if (h <= 0) return;
    ctx.fillStyle = "#2fb584";
    roundRect(ctx, x, y, PIPE_W, h, 8);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(x + 8, y + 4, 8, Math.max(0, h - 8));
    var capY = capAtTop ? y : y + h - 26;
    ctx.fillStyle = "#34d399";
    roundRect(ctx, x - 5, capY, PIPE_W + 10, 26, 8);
    ctx.fill();
    ctx.strokeStyle = "rgba(11,16,32,0.35)";
    ctx.lineWidth = 2;
    roundRect(ctx, x - 5, capY, PIPE_W + 10, 26, 8);
    ctx.stroke();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // 身体
    ctx.save();
    ctx.shadowColor = "rgba(251,191,36,0.55)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 肚子
    ctx.fillStyle = "rgba(253,230,138,0.9)";
    ctx.beginPath();
    ctx.arc(0, 3, 9.5, 0, Math.PI);
    ctx.fill();

    // 翅膀
    var wA = Math.sin(bird.wing * Math.PI * 2) * 0.9;
    ctx.save();
    ctx.translate(-2, 1);
    ctx.rotate(wA);
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.ellipse(-3, 0, 7.5, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 嘴
    ctx.fillStyle = "#fb923c";
    ctx.beginPath();
    ctx.moveTo(10, -2);
    ctx.lineTo(19.5, 1);
    ctx.lineTo(10, 4.5);
    ctx.closePath();
    ctx.fill();

    // 眼睛
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.arc(5, -5, 4.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0b1020";
    ctx.beginPath();
    ctx.arc(6.4, -5, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = "#0c1224";
    ctx.fillRect(0, 0, W, H);

    // 星星（视差滚动）
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var sx = ((s.x - scrollX * 0.15) % W + W) % W;
      ctx.globalAlpha = 0.25 + 0.25 * Math.sin(tGlob * 2 + s.p);
      ctx.fillStyle = "#94a3b8";
      ctx.beginPath();
      ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 水管
    for (i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      drawPipe(p.x, 0, p.gapY, false);
      drawPipe(p.x, p.gapY + p.gap, H - GROUND - (p.gapY + p.gap), true);
    }

    // 地面
    ctx.fillStyle = "#131a2e";
    ctx.fillRect(0, H - GROUND, W, GROUND);
    ctx.fillStyle = "rgba(52,211,153,0.5)";
    ctx.fillRect(0, H - GROUND, W, 3);
    ctx.fillStyle = "rgba(56,189,248,0.07)";
    var off = scrollX % 36;
    for (var gx = -off; gx < W; gx += 36) {
      ctx.fillRect(gx, H - GROUND + 12, 18, GROUND - 22);
    }

    drawBird();

    // 顶部大分数
    if (state === "play") {
      ctx.fillStyle = "rgba(226,232,240,0.85)";
      ctx.font = "700 40px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(String(score), W / 2, 16);
    }
  }

  // ---------- 主循环 ----------
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.032, (now - lastT) / 1000);
    lastT = now;
    update(dt);
    draw();
  }

  // ---------- 流程 ----------
  function restart() {
    reset();
  }

  function showOverlay(title, html) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = html;
    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
    newBest.classList.remove("show");
  }

  // ---------- 输入 ----------
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (state === "dead") restart();
      return;
    }
    if (e.key === " " || e.key === "ArrowUp") {
      e.preventDefault();
      if (state !== "dead") action();
    }
  }, { passive: false });

  shell.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state !== "dead") action();
  });

  // 按钮不触发拍翅
  restartBtn.addEventListener("pointerdown", function (e) {
    e.stopPropagation();
  });
  restartBtn.addEventListener("click", restart);

  // ---------- 启动 ----------
  reset();
  requestAnimationFrame(function (t) { lastT = t; loop(t); });
})();
</script>
</body>
</html>
