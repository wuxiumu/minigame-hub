<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · 数字合并</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b1020;
    --panel: #131a2e;
    --board: #101830;
    --line: rgba(148, 163, 184, 0.08);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --snake: #34d399;
    --snake-head: #6ee7b7;
    --food: #fb7185;
    --accent: #38bdf8;
  }

  html, body { height: 100%; }

  body {
    background: radial-gradient(1200px 800px at 50% -10%, #16213c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(92vw, 460px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 .dot {
    width: 12px; height: 12px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--snake), var(--accent));
    box-shadow: 0 0 12px rgba(52, 211, 153, .6);
  }

  .scores { display: flex; gap: 10px; }

  .score-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 16px;
    min-width: 92px;
    text-align: center;
  }

  .score-card .label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .score-card .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  #score .value { color: var(--snake); }
  #best .value { color: var(--accent); }

  .board-shell {
    position: relative;
    background: var(--board);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .02);
  }

  .grid {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0c1224;
    border-radius: 14px;
    overflow: hidden;
    touch-action: none;
  }

  .cellbg {
    position: absolute;
    background: rgba(148, 163, 184, 0.07);
    border-radius: 10px;
  }

  .tile {
    position: absolute;
    top: 0; left: 0;
    transition: transform .12s ease;
    will-change: transform;
    z-index: 2;
  }

  .tile-inner {
    width: 100%; height: 100%;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .tile-inner.appear { animation: appear .18s ease; }
  @keyframes appear {
    from { transform: scale(.3); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  .tile-inner.pop { animation: pop .2s ease; }
  @keyframes pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  .v2    { background: #233150; color: #cbd5e1; }
  .v4    { background: #2a3a63; color: #dbeafe; }
  .v8    { background: #2f5d7c; color: #e0f2fe; }
  .v16   { background: #31779b; color: #e0f2fe; }
  .v32   { background: #3390b5; color: #f0f9ff; }
  .v64   { background: #38bdf8; color: #06202e; }
  .v128  { background: #34d399; color: #053324; box-shadow: 0 0 16px rgba(52, 211, 153, .35); }
  .v256  { background: #6ee7b7; color: #053324; }
  .v512  { background: #fbbf24; color: #3a2a05; box-shadow: 0 0 16px rgba(251, 191, 36, .35); }
  .v1024 { background: #fb923c; color: #3a1c05; }
  .v2048 { background: #fb7185; color: #3d0714; box-shadow: 0 0 24px rgba(251, 113, 133, .55); }
  .vmax  { background: linear-gradient(135deg, #fb7185, #f43f5e); color: #fff; box-shadow: 0 0 24px rgba(244, 63, 94, .55); }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(8, 12, 26, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 3;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .overlay .final {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
  }

  .overlay .final b {
    color: var(--snake);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  .overlay .newbest {
    font-size: 13px;
    color: #fbbf24;
    display: none;
  }

  .overlay .newbest.show { display: block; }

  .btns { display: flex; gap: 10px; }

  #continueBtn { display: none; }
  #continueBtn.show { display: inline-block; }

  button {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #34d399, #38bdf8);
    color: #06251c;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 11px 30px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(56, 189, 248, .35);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56, 189, 248, .45); }
  button:active { transform: translateY(0); }

  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="dot"></span>2048</h1>
      <div class="scores">
        <div class="score-card" id="score">
          <div class="label">得分</div>
          <div class="value">0</div>
        </div>
        <div class="score-card" id="best">
          <div class="label">最高分</div>
          <div class="value">0</div>
        </div>
      </div>
    </header>

    <div class="board-shell">
      <div class="grid" id="grid">
        <div id="tiles"></div>
        <div class="overlay" id="overlay">
          <div class="title" id="overlayTitle">准备好了吗？</div>
          <div class="final" id="overlayText">滑动合并相同数字，目标 <b>2048</b></div>
          <div class="newbest" id="newBest">🎉 新纪录！</div>
          <div class="btns">
            <button id="continueBtn">继续挑战</button>
            <button id="restartBtn">开始游戏</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动
      &nbsp;·&nbsp; 手机滑动屏幕同样可玩 &nbsp;·&nbsp; <kbd>Enter</kbd> 重新开始
    </p>
  </div>

<script>
(function () {
  "use strict";

  // ---------- 常量 ----------
  var SIZE = 4;
  var PAD = 10, GAP = 10;
  var BEST_KEY = "game2048.best.score";

  var gridEl = document.getElementById("grid");
  var tilesEl = document.getElementById("tiles");
  var scoreValue = document.querySelector("#score .value");
  var bestValue = document.querySelector("#best .value");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");
  var newBest = document.getElementById("newBest");
  var restartBtn = document.getElementById("restartBtn");
  var continueBtn = document.getElementById("continueBtn");

  // ---------- 游戏状态 ----------
  var grid;                    // grid[r][c] = tile | null
  var score = 0, best;
  var won = false;             // 已达成 2048
  var wonPaused = false;       // 胜利弹窗等待「继续挑战」
  var over = false;
  var locked = false;          // 动画期间锁定输入
  var started = false;
  var gen = 0;                 // 重开代数，用于丢弃过期的动画回调

  best = loadBest();
  bestValue.textContent = best;

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(BEST_KEY), 10);
      return isNaN(v) || v < 0 ? 0 : v;
    } catch (e) { return 0; }
  }

  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  // ---------- 布局 ----------
  function cellSize() {
    return (gridEl.clientWidth - PAD * 2 - GAP * (SIZE - 1)) / SIZE;
  }

  function posOf(r, c) {
    var s = cellSize();
    return { x: PAD + c * (s + GAP), y: PAD + r * (s + GAP) };
  }

  // 背景格
  var bgCells = [];
  (function buildBg() {
    for (var i = 0; i < SIZE * SIZE; i++) {
      var d = document.createElement("div");
      d.className = "cellbg";
      gridEl.insertBefore(d, tilesEl);
      bgCells.push(d);
    }
  })();

  function layout() {
    var s = cellSize();
    for (var i = 0; i < bgCells.length; i++) {
      var r = Math.floor(i / SIZE), c = i % SIZE;
      var p = posOf(r, c);
      bgCells[i].style.left = p.x + "px";
      bgCells[i].style.top = p.y + "px";
      bgCells[i].style.width = s + "px";
      bgCells[i].style.height = s + "px";
    }
    forEachTile(placeTile);
  }

  function forEachTile(fn) {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (grid[r][c]) fn(grid[r][c]);
  }

  function placeTile(t) {
    var s = cellSize();
    t.el.style.width = s + "px";
    t.el.style.height = s + "px";
    var p = posOf(t.r, t.c);
    t.el.style.transform = "translate(" + p.x + "px," + p.y + "px)";
  }

  // ---------- 方块 ----------
  function classFor(v) { return v <= 2048 ? "v" + v : "vmax"; }

  function setFace(t) {
    var digits = String(t.v).length;
    var s = cellSize();
    var fs = digits <= 2 ? 0.44 : digits === 3 ? 0.36 : digits === 4 ? 0.3 : 0.24;
    t.inner.textContent = t.v;
    t.inner.className = "tile-inner " + classFor(t.v);
    t.inner.style.fontSize = Math.round(s * fs) + "px";
  }

  function createTile(r, c, v, appear) {
    var el = document.createElement("div");
    el.className = "tile";
    var inner = document.createElement("div");
    inner.className = "tile-inner";
    el.appendChild(inner);
    var t = { r: r, c: c, v: v, el: el, inner: inner, merged: false };
    setFace(t);
    placeTile(t);
    if (appear) inner.classList.add("appear");
    tilesEl.appendChild(el);
    grid[r][c] = t;
    return t;
  }

  function spawn() {
    var empties = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!grid[r][c]) empties.push({ r: r, c: c });
    if (!empties.length) return;
    var p = empties[Math.floor(Math.random() * empties.length)];
    createTile(p.r, p.c, Math.random() < 0.9 ? 2 : 4, true);
  }

  function movesAvailable() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var t = grid[r][c];
        if (!t) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
      }
    }
    return false;
  }

  // ---------- 核心：移动 + 合并 ----------
  function move(dr, dc) {
    if (locked || over || wonPaused) return;
    if (!started) start();

    // 靠近目标边的方块先处理
    var rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    if (dr === 1) rows = [3, 2, 1, 0];
    if (dc === 1) cols = [3, 2, 1, 0];

    var merges = [], sliders = [], moved = false;
    forEachTile(function (t) { t.merged = false; });

    for (var ri = 0; ri < SIZE; ri++) {
      for (var ci = 0; ci < SIZE; ci++) {
        var r = rows[ri], c = cols[ci];
        var t = grid[r][c];
        if (!t) continue;
        var nr = r, nc = c, target = null;
        for (;;) {
          var tr = nr + dr, tc = nc + dc;
          if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
          var o = grid[tr][tc];
          if (!o) { nr = tr; nc = tc; continue; }
          if (o.v === t.v && !o.merged) target = o;
          break;
        }
        if (target) {
          grid[r][c] = null;
          t.r = target.r; t.c = target.c;
          target.merged = true;
          merges.push({ stay: target, gone: t });
          sliders.push(t);
          moved = true;
        } else if (nr !== r || nc !== c) {
          grid[r][c] = null;
          grid[nr][nc] = t;
          t.r = nr; t.c = nc;
          sliders.push(t);
          moved = true;
        }
      }
    }

    if (!moved) return;

    locked = true;
    forEachTile(placeTile);
    for (var i = 0; i < sliders.length; i++) placeTile(sliders[i]);

    var g = gen;
    setTimeout(function () {
      if (g !== gen) return;   // 期间已重开，丢弃
      var gained = 0, winNow = false;
      for (var i = 0; i < merges.length; i++) {
        var m = merges[i];
        if (m.gone.el.parentNode) m.gone.el.parentNode.removeChild(m.gone.el);
        m.stay.v *= 2;
        setFace(m.stay);
        m.stay.inner.classList.remove("pop");
        void m.stay.inner.offsetWidth;   // 重启 pop 动画
        m.stay.inner.classList.add("pop");
        gained += m.stay.v;
        if (m.stay.v >= 2048 && !won) { won = true; winNow = true; }
      }
      if (gained) addScore(gained);
      spawn();
      locked = false;
      if (!movesAvailable()) { doGameOver(); return; }
      if (winNow) showWin();
    }, 130);
  }

  function addScore(g) {
    score += g;
    scoreValue.textContent = score;
    if (score > best) {
      best = score;
      bestValue.textContent = best;
      saveBest(best);
    }
  }

  // ---------- 流程 ----------
  function start() {
    started = true;
    hideOverlay();
  }

  function restart() {
    gen++;
    locked = false; wonPaused = false; over = false; won = false; started = false;
    tilesEl.innerHTML = "";
    grid = [];
    for (var r = 0; r < SIZE; r++) grid.push([null, null, null, null]);
    score = 0;
    scoreValue.textContent = "0";
    restartBtn.textContent = "开始游戏";
    spawn();
    spawn();
    layout();
    showOverlay("准备好了吗？", "滑动合并相同数字，目标 <b>2048</b>");
  }

  function doGameOver() {
    over = true;
    restartBtn.textContent = "再来一局";
    newBest.className = "newbest" + (score > 0 && score === best ? " show" : "");
    showOverlay("游戏结束", "最终得分 <b>" + score + "</b>");
  }

  function showWin() {
    wonPaused = true;
    restartBtn.textContent = "再来一局";
    overlayTitle.textContent = "你赢啦 🎉";
    overlayText.innerHTML = "成功合成 <b>2048</b>！还可以继续冲击更高分";
    continueBtn.classList.add("show");
    overlay.classList.add("show");
  }

  // ---------- 覆盖层 ----------
  function showOverlay(title, html) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = html;
    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
    newBest.classList.remove("show");
    continueBtn.classList.remove("show");
  }

  // ---------- 输入：键盘 ----------
  var KEYS = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
    w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1],
    W: [-1, 0], S: [1, 0], A: [0, -1], D: [0, 1]
  };

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      restart();
      return;
    }
    var k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    move(k[0], k[1]);
  }, { passive: false });

  // ---------- 输入：触摸滑动 ----------
  var tsx = 0, tsy = 0, tracking = false;

  gridEl.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    tsx = e.touches[0].clientX;
    tsy = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  gridEl.addEventListener("touchmove", function (e) {
    e.preventDefault();          // 阻止页面滚动 / 下拉刷新
  }, { passive: false });

  gridEl.addEventListener("touchend", function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) move(0, dx > 0 ? 1 : -1);
    else move(dy > 0 ? 1 : -1, 0);
  });

  // ---------- 按钮 ----------
  restartBtn.addEventListener("click", restart);
  continueBtn.addEventListener("click", function () {
    wonPaused = false;
    hideOverlay();
  });
  window.addEventListener("resize", layout);

  // ---------- 启动 ----------
  restart();
})();
</script>
</body>
</html>
