name: build-blog

on:
  push:
    paths:
      - 'games/**/*.md'
      - 'tools/build_blog.py'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown-it-py
      - run: python3 tools/build_blog.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild blog html from games md'
          file_pattern: 'blog/*.html'
